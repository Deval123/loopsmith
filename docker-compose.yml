# Local services only: both ports are published on loopback, never on the network.
# Pin both images to a specific tag (or digest) before you rely on this.
services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  graphhopper:
    image: israelhikingmap/graphhopper:latest
    ports:
      - "127.0.0.1:8989:8989"
    volumes:
      - ./graphhopper:/data
    command: ["-c", "/data/config.yml", "-i", "/data/region.osm.pbf", "--host", "0.0.0.0"]

volumes:
  ollama-data:
